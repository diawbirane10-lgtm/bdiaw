name: Portfolio build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "recovered-ohmega/**"
      - ".github/workflows/portfolio-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "recovered-ohmega/**"
      - ".github/workflows/portfolio-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-ohmega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Test visit history and browser preferences
        run: node --test scripts/*.test.mjs
      - run: npm run build
      - name: Smoke test rendered pages and fonts
        run: python3 scripts/smoke.py
