name: Portfolio build check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "recovered-ohmega/**"
  pull_request:
    branches: [main]
    paths:
      - "recovered-ohmega/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recovered-ohmega
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run build
