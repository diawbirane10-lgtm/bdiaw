name: b-diaw.com SEO Growth Bot

on:
  schedule:
    - cron: "43 6 * * 1"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-growth.yml"
      - "seo-bot/**"
      - "recovered-ohmega/app/layout.jsx"
      - "recovered-ohmega/app/robots.js"
      - "recovered-ohmega/app/sitemap.js"
      - "recovered-ohmega/app/[[...slug]]/**"

permissions:
  contents: read
  issues: write

jobs:
  growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: seo-bot/requirements.txt

      - name: Install SEO dependencies
        run: python -m pip install -r seo-bot/requirements.txt

      - name: Technical SEO audit
        id: technical
        continue-on-error: true
        run: python seo-bot/scripts/seo_audit.py

      - name: Keyword coverage audit
        if: always()
        run: python seo-bot/scripts/keyword_audit.py

      - name: Build autonomous growth recommendations
        if: always()
        run: python seo-bot/scripts/growth_autopilot.py

      - name: Notify IndexNow-compatible search engines
        if: always()
        continue-on-error: true
        run: python seo-bot/scripts/indexnow_submit.py

      - name: Upload SEO reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-growth-${{ github.run_number }}
          path: seo-bot/reports/
          if-no-files-found: error
          retention-days: 90

      - name: Publish weekly SEO issue
        if: always() && hashFiles('seo-bot/reports/growth-autopilot.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat seo-bot/reports/growth-autopilot.md
            if [ -f seo-bot/reports/seo-audit.md ]; then
              echo
              echo "---"
              echo
              cat seo-bot/reports/seo-audit.md
            fi
            if [ -f seo-bot/reports/keyword-audit.md ]; then
              echo
              echo "---"
              echo
              cat seo-bot/reports/keyword-audit.md
            fi
          } > /tmp/seo-growth.md

          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"b-diaw.com weekly SEO growth" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file /tmp/seo-growth.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "b-diaw.com weekly SEO growth" --body-file /tmp/seo-growth.md
          fi

      - name: Fail on critical SEO regression
        if: steps.technical.outcome == 'failure'
        run: exit 1
