name: b-diaw.com IndexNow

on:
  push:
    branches: [main]
    paths:
      - "recovered-ohmega/**"
      - "seo-bot/scripts/indexnow_submit.py"
      - ".github/workflows/seo-indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: python -m pip install requests

      - name: Notify IndexNow-compatible search engines
        run: python seo-bot/scripts/indexnow_submit.py
