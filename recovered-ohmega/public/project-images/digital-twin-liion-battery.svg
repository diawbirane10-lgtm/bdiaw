<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Li-ion battery pack digital twin</title><desc id="d">Battery measurements feed an equivalent-circuit and estimation layer to expose SOC, SOH, RUL, thermal state and protection information.</desc><rect width="1600" height="900" fill="#f8fafb"/><text x="100" y="100" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#143c52">DIGITAL TWIN — LI-ION BATTERY PACKS</text><text x="100" y="810" font-family="Arial,sans-serif" font-size="23" fill="#506779">Measurements → model & estimation → internal state insight → dashboard / API / protection</text><g font-family="Arial,sans-serif"><rect x="110" y="260" width="300" height="300" fill="#fff" stroke="#90a8b5" stroke-width="3"/><g fill="#dfe8ec" stroke="#0b4f6c" stroke-width="3"><rect x="155" y="315" width="55" height="135"/><rect x="225" y="315" width="55" height="135"/><rect x="295" y="315" width="55" height="135"/></g><text x="155" y="500" font-size="26" font-weight="700" fill="#143c52">BATTERY PACK</text><text x="145" y="535" font-size="19" fill="#637783">Voltage · current · temperature</text><path d="M410 405H520" stroke="#0b4f6c" stroke-width="6"/><path d="m520 405-24-14v28z" fill="#0b4f6c"/><rect x="520" y="225" width="340" height="360" fill="#fff" stroke="#0b4f6c" stroke-width="4"/><text x="570" y="285" font-size="28" font-weight="700" fill="#143c52">TWIN ENGINE</text><text x="570" y="330" font-size="21" fill="#637783">Thevenin 2RC model</text><text x="570" y="370" font-size="21" fill="#637783">Extended Kalman Filter</text><text x="570" y="410" font-size="21" fill="#637783">Thermal behaviour</text><text x="570" y="450" font-size="21" fill="#637783">Degradation tracking</text><rect x="565" y="485" width="245" height="55" fill="#edf4f7" stroke="#2c8fb8" stroke-width="3"/><text x="600" y="520" font-size="21" font-weight="700" fill="#143c52">STATE ESTIMATION</text><path d="M860 405H970" stroke="#0b4f6c" stroke-width="6"/><path d="m970 405-24-14v28z" fill="#0b4f6c"/><rect x="970" y="215" width="500" height="380" fill="#fff" stroke="#90a8b5" stroke-width="3"/><text x="1020" y="270" font-size="28" font-weight="700" fill="#143c52">INSPECTION LAYER</text><g font-size="22" font-weight="700"><rect x="1020" y="315" width="180" height="70" fill="#dff3e5" stroke="#2e8b57"/><text x="1060" y="358" fill="#236b45">SOC</text><rect x="1225" y="315" width="180" height="70" fill="#dff3e5" stroke="#2e8b57"/><text x="1265" y="358" fill="#236b45">SOH / RUL</text><rect x="1020" y="410" width="180" height="70" fill="#fff3cd" stroke="#d6a72b"/><text x="1050" y="453" fill="#725b0d">THERMAL</text><rect x="1225" y="410" width="180" height="70" fill="#fde2e3" stroke="#d64045"/><text x="1255" y="453" fill="#8b1f24">PROTECTION</text></g><text x="1020" y="535" font-size="20" fill="#637783">Streamlit dashboard · FastAPI · scenario comparison</text></g></svg>