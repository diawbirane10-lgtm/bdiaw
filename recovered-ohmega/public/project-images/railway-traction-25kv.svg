<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">25 kV AC railway traction energy recovery</title><desc id="d">Regenerative braking returns electrical energy from the train through the converter to the traction network.</desc><rect width="1600" height="900" fill="#f8fafb"/><text x="100" y="100" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#143c52">25 kV AC RAILWAY TRACTION — REGENERATIVE BRAKING</text><text x="100" y="810" font-family="Arial,sans-serif" font-size="23" fill="#506779">Train deceleration → motors generate → converter conditions power → network reuses recovered energy</text><g font-family="Arial,sans-serif"><line x1="100" y1="580" x2="1500" y2="580" stroke="#6f7e86" stroke-width="10"/><line x1="100" y1="615" x2="1500" y2="615" stroke="#6f7e86" stroke-width="5"/><path d="M145 450h330l80 70H125z" fill="#dfe8ec" stroke="#143c52" stroke-width="4"/><rect x="185" y="475" width="80" height="38" fill="#a9c5d2"/><rect x="285" y="475" width="80" height="38" fill="#a9c5d2"/><circle cx="205" cy="575" r="35" fill="#fff" stroke="#143c52" stroke-width="6"/><circle cx="445" cy="575" r="35" fill="#fff" stroke="#143c52" stroke-width="6"/><text x="145" y="405" font-size="27" font-weight="700" fill="#143c52">TRAIN BRAKING</text><path d="M555 500H680" stroke="#d64045" stroke-width="7"/><path d="m680 500-26-15v30z" fill="#d64045"/><rect x="680" y="385" width="250" height="230" fill="#fff" stroke="#0b4f6c" stroke-width="4"/><circle cx="805" cy="485" r="58" fill="#edf4f7" stroke="#0b4f6c" stroke-width="4"/><text x="770" y="495" font-size="31" font-weight="700" fill="#143c52">M/G</text><text x="720" y="555" font-size="20" fill="#637783">Traction motor acts</text><text x="737" y="582" font-size="20" fill="#637783">as generator</text><path d="M930 500H1040" stroke="#d64045" stroke-width="7"/><path d="m1040 500-26-15v30z" fill="#d64045"/><rect x="1040" y="380" width="245" height="240" fill="#fff" stroke="#0b4f6c" stroke-width="4"/><text x="1088" y="435" font-size="27" font-weight="700" fill="#143c52">CONVERTER</text><path d="M1090 520h145M1120 480l40 40-40 40M1210 480l-40 40 40 40" fill="none" stroke="#2c8fb8" stroke-width="6"/><path d="M1160 380V245H1425" fill="none" stroke="#d64045" stroke-width="7"/><path d="m1425 245-26-15v30z" fill="#d64045"/><line x1="1340" y1="205" x2="1340" y2="625" stroke="#546a76" stroke-width="6"/><line x1="1295" y1="245" x2="1435" y2="245" stroke="#546a76" stroke-width="5"/><text x="1260" y="175" font-size="27" font-weight="700" fill="#143c52">25 kV AC TRACTION NETWORK</text><rect x="1320" y="655" width="210" height="70" fill="#dff3e5" stroke="#2e8b57" stroke-width="3"/><text x="1350" y="697" font-size="20" font-weight="700" fill="#236b45">REUSE / STORAGE</text></g></svg>