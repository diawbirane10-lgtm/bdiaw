<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Smart-Grid UFLS protection flow</title><desc id="d">Frequency disturbance monitored by an UFLS relay, followed by staged shedding and recovery.</desc><rect width="1600" height="900" fill="#f7fafb"/><g fill="none" stroke="#0b4f6c" stroke-width="4"><path d="M95 142H1505"/><path d="M95 758H1505"/></g><text x="100" y="105" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#143c52">UNDER-FREQUENCY LOAD SHEDDING — UFLS</text><text x="100" y="810" font-family="Arial,sans-serif" font-size="23" fill="#506779">50 Hz disturbance → threshold validation → selective shedding → frequency recovery</text><g font-family="Arial,sans-serif"><rect x="100" y="240" width="270" height="210" fill="#fff" stroke="#90a8b5" stroke-width="3"/><text x="135" y="290" font-size="28" font-weight="700" fill="#143c52">GRID EVENT</text><path d="M140 372C190 345 220 410 270 350S330 320 345 300" fill="none" stroke="#d64045" stroke-width="7"/><line x1="140" y1="393" x2="345" y2="393" stroke="#ccd7dd" stroke-width="3"/><text x="140" y="430" font-size="19" fill="#637783">Frequency drops below 50 Hz</text><path d="M370 345H510" stroke="#0b4f6c" stroke-width="6"/><path d="m510 345-24-14v28z" fill="#0b4f6c"/><rect x="510" y="210" width="360" height="310" fill="#fff" stroke="#0b4f6c" stroke-width="4"/><text x="560" y="265" font-size="30" font-weight="700" fill="#143c52">UFLS RELAY</text><text x="560" y="310" font-size="20" fill="#637783">Stateflow protection logic</text><g font-size="20" font-weight="700"><rect x="560" y="350" width="255" height="42" fill="#fff3cd" stroke="#d6a72b"/><text x="580" y="378" fill="#725b0d">ALERT / CONFIRM</text><rect x="560" y="410" width="255" height="42" fill="#fde2e3" stroke="#d64045"/><text x="580" y="438" fill="#8b1f24">SHED 1 · SHED 2 · SHED 3</text><rect x="560" y="470" width="255" height="42" fill="#dff3e5" stroke="#2e8b57"/><text x="580" y="498" fill="#236b45">RESTORE</text></g><path d="M870 365H1010" stroke="#0b4f6c" stroke-width="6"/><path d="m1010 365-24-14v28z" fill="#0b4f6c"/><rect x="1010" y="205" width="490" height="360" fill="#fff" stroke="#90a8b5" stroke-width="3"/><text x="1050" y="255" font-size="28" font-weight="700" fill="#143c52">STAGED LOAD SHEDDING</text><g><rect x="1050" y="305" width="365" height="54" fill="#dff3e5" stroke="#2e8b57" stroke-width="3"/><text x="1080" y="340" font-size="21" fill="#236b45">CRITICAL LOADS — KEPT ONLINE</text><rect x="1050" y="385" width="365" height="54" fill="#fff3cd" stroke="#d6a72b" stroke-width="3"/><text x="1080" y="420" font-size="21" fill="#725b0d">STAGE 1 — NON-CRITICAL FEEDERS</text><rect x="1050" y="465" width="365" height="54" fill="#fde2e3" stroke="#d64045" stroke-width="3"/><text x="1080" y="500" font-size="21" fill="#8b1f24">STAGES 2–3 — IF REQUIRED</text></g><path d="M1250 565V655H690V520" fill="none" stroke="#2e8b57" stroke-width="5"/><path d="m690 520-14 24h28z" fill="#2e8b57"/><text x="830" y="645" font-size="20" fill="#2e8b57">Recovery criteria satisfied → restoration</text></g></svg>