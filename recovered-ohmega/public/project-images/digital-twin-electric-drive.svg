<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Variable-speed electric drive digital twin</title><desc id="d">Converter, motor and load are mirrored by a state-space model and cascade PI controller for response comparison and tuning.</desc><rect width="1600" height="900" fill="#f8fafb"/><text x="100" y="100" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#143c52">DIGITAL TWIN — VARIABLE-SPEED ELECTRIC DRIVE</text><text x="100" y="810" font-family="Arial,sans-serif" font-size="23" fill="#506779">Converter + motor + load ↔ state-space twin → cascade PI control → response analysis</text><g font-family="Arial,sans-serif"><text x="100" y="190" font-size="22" font-weight="700" fill="#143c52">PHYSICAL / SIMULATED DRIVE</text><rect x="100" y="240" width="280" height="200" fill="#fff" stroke="#0b4f6c" stroke-width="4"/><text x="155" y="300" font-size="27" font-weight="700" fill="#143c52">H-BRIDGE</text><path d="M145 355h190M175 320l40 35-40 35M305 320l-40 35 40 35" fill="none" stroke="#2c8fb8" stroke-width="6"/><path d="M380 340H500" stroke="#0b4f6c" stroke-width="6"/><path d="m500 340-24-14v28z" fill="#0b4f6c"/><circle cx="620" cy="340" r="100" fill="#fff" stroke="#0b4f6c" stroke-width="4"/><text x="580" y="350" font-size="36" font-weight="700" fill="#143c52">M</text><text x="550" y="480" font-size="25" font-weight="700" fill="#143c52">ELECTRIC MOTOR</text><path d="M720 340H850" stroke="#0b4f6c" stroke-width="6"/><path d="m850 340-24-14v28z" fill="#0b4f6c"/><rect x="850" y="260" width="260" height="160" fill="#fff" stroke="#90a8b5" stroke-width="3"/><text x="930" y="325" font-size="27" font-weight="700" fill="#143c52">LOAD</text><text x="895" y="370" font-size="19" fill="#637783">Mechanical dynamics</text><text x="100" y="590" font-size="22" font-weight="700" fill="#143c52">DIGITAL TWIN / CONTROL</text><rect x="100" y="625" width="390" height="120" fill="#fff" stroke="#0b4f6c" stroke-width