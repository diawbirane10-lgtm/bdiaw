<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="title desc">
  <title id="title">République du Sénégal — Ministère de l'Énergie, du Pétrole et des Mines</title>
  <desc id="desc">Drapeau du Sénégal, devise nationale et nom du ministère.</desc>

  <g transform="translate(36 26)">
    <rect x="0" y="0" width="216" height="360" fill="#00853F"/>
    <rect x="216" y="0" width="216" height="360" fill="#FDEF42"/>
    <rect x="432" y="0" width="216" height="360" fill="#E31B23"/>
    <polygon fill="#00853F" points="324,122 343,181 405,181 355,217 374,276 324,240 274,276 293,217 243,181 305,181"/>
  </g>

  <text x="360" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="400" fill="#111111">République du Sénégal</text>
  <line x1="72" y1="505" x2="648" y2="505" stroke="#6D6D6D" stroke-width="3"/>

  <text x="360" y="558" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#333333">Un Peuple  ·  Un But  ·  Une Foi</text>

  <text x="360" y="646" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="#111111">MINISTÈRE DE L’ÉNERGIE,</text>
  <text x="360" y="706" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="#111111">DU PÉTROLE ET DES MINES</text>
</svg>