<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 342" role="img" aria-labelledby="title desc">
  <title id="title">Ministère de l'Énergie, du Pétrole et des Mines — République du Sénégal</title>
  <desc id="desc">Official ministry lockup with Senegal flag and ministry name.</desc>
  <rect width="1200" height="342" fill="#fff"/>

  <!-- Senegal flag -->
  <g transform="translate(38 34)">
    <rect x="0" y="0" width="84" height="222" fill="#00853f"/>
    <rect x="84" y="0" width="84" height="222" fill="#fdef42"/>
    <rect x="168" y="0" width="84" height="222" fill="#e31b23"/>
    <polygon fill="#00853f" points="126,65 139,105 181,105 147,129 160,169 126,144 92,169 105,129 71,105 113,105"/>
    <text x="126" y="290" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="1.2">REPUBLIQUE DU</text>
    <text x="126" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="1.2">SENEGAL</text>
  </g>

  <!-- Ministry name -->
  <g transform="translate(345 38)" fill="#050505" font-family="Arial, Helvetica, sans-serif" font-weight="800">
    <text x="0" y="58" font-size="46" letter-spacing="0.6">MINISTERE DE</text>
    <text x="0" y="118" font-size="46" letter-spacing="0.6">L'ENERGIE, DU</text>
    <text x="0" y="178" font-size="46" letter-spacing="0.6">PETROLE ET</text>
    <text x="0" y="238" font-size="46" letter-spacing="0.6">DES MINES</text>
  </g>
</svg>