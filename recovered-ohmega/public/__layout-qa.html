<!doctype html><html><head><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width"><title>Responsive layout QA</title><style>body{margin:0;padding:20px;background:#ddd;display:flex;gap:24px;align-items:start;font:14px Arial}iframe{border:0;background:white;display:block;height:844px}section{flex-shrink:0}h2{font-size:16px;margin:0 0 10px}</style></head><body><script>const params=new URLSearchParams(location.search);const route=params.get('route')||'/';const allowed=['/','/projects','/about','/experience','/research','/contact','/projects/digital-twin-liion-battery'];const widths=params.has('tablet')?[768,820,1024]:[360,390,430];widths.forEach(width=>{const s=document.createElement('section');const h=document.createElement('h2');h.textContent=width+' px';const f=document.createElement('iframe');f.width=width;f.title='Layout at '+width+' pixels';f.src=allowed.includes(route)?route:'/';s.append(h,f);document.body.append(s)})</script></body></html>
